name: Build and Push Docker Image

on:
  push:
    branches: ["main", "uat"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railpack
        run: curl -sSL https://railpack.com/install.sh | sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=latest" >> "$GITHUB_ENV"
          else
            echo "TAG=uat" >> "$GITHUB_ENV"
          fi

      - name: Build image with Railpack
        run: railpack build --name ghcr.io/franciscofhdias/dokploy-test:${{ env.TAG }} .

      - name: Push image
        run: docker push ghcr.io/franciscofhdias/dokploy-test:${{ env.TAG }}

      - name: Trigger Dokploy deploy (prod)
        if: github.ref_name == 'main'
        run: curl -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}"

      - name: Trigger Dokploy deploy (uat)
        if: github.ref_name == 'uat'
        run: curl -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_UAT }}"
